[project]
name = "zen-harness"
version = "0.1.0"
description = "Let coding agents drive your real Zen browser over WebDriver BiDi."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["websockets>=13"]

[project.scripts]
zen-harness = "zen_harness.run:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zen_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

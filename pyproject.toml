[project]
name = "zen-harness"
version = "0.1.0"
description = "Let AI coding agents (Claude Code, Codex) use your real Zen browser: browser-harness for Zen, over WebDriver BiDi."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Teresa Tian" }]
keywords = [
  "zen-browser", "browser-automation", "ai-agents", "claude-code", "codex",
  "browser-harness", "webdriver-bidi", "llm", "agentic-browsing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
]
dependencies = ["websockets>=13"]

[project.urls]
Homepage = "https://github.com/Astatine-213-Tian/zen-harness"
Issues = "https://github.com/Astatine-213-Tian/zen-harness/issues"

[project.scripts]
zen-harness = "zen_harness.run:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zen_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

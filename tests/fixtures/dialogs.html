<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
  <button id="alert" onclick="alert('Saved'); window.__after = 'alert closed'">Alert</button>
  <button id="delete" onclick="window.__deleted = confirm('Delete 3 files?')">Delete</button>
  <button id="prompt" onclick="window.__name = prompt('Your name?', 'guest')">Prompt</button>
  <label><input id="dirty"> (typing here arms beforeunload)</label>
  <script>
    document.getElementById('dirty').addEventListener('input', () => {
      window.onbeforeunload = e => { e.preventDefault(); e.returnValue = ''; };
    });
  </script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Network</title></head>
<body>
  <p id="first"></p>
  <button id="load" onclick="load()">Load page 2</button>
  <button id="xhr" onclick="loadXhr()">Load page 3 (XHR)</button>
  <ul id="items"></ul>
  <input id="search" placeholder="Search (debounced)">
  <p id="hits"></p>
  <script>
    fetch('/api/items?page=1').then(r => r.json())  // page 1 arrives while the page loads
      .then(d => document.getElementById('first').textContent = d.items.join(', '));
    async function load() {
      const r = await fetch('/api/items?page=2&ms=300');
      const data = await r.json();
      document.getElementById('items').innerHTML = data.items.map(i => `<li>${i}</li>`).join('');
    }
    function loadXhr() {
      const x = new XMLHttpRequest();
      x.open('GET', '/api/items?page=3');
      x.onload = () => document.getElementById('items').innerHTML =
        JSON.parse(x.responseText).items.map(i => `<li>${i}</li>`).join('');
      x.send();
    }
    let timer;
    document.getElementById('search').addEventListener('input', e => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const r = await fetch('/api/items?page=' + encodeURIComponent(e.target.value));
        document.getElementById('hits').textContent = (await r.json()).items.join(', ');
      }, 400);
    });
  </script>
</body>
</html>

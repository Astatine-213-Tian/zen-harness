<!doctype html>
<html>
<head><meta charset="utf-8"><title>Frames</title></head>
<body>
  <p>Parent page</p>
  <iframe id="same" src="frame-inner.html" width="400" height="120"></iframe>
  <iframe id="cross" width="400" height="120"></iframe>
  <script>
    // Same server under another host name = another origin.
    document.getElementById('cross').src = `http://localhost:${location.port}/frame-inner.html?cross=1`;
  </script>
</body>
</html>
